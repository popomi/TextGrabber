name: Build TextGrabber APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable with LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias textgrabber \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass textgrabber123 \
            -keypass textgrabber123 \
            -dname "CN=TextGrabber, OU=Dev, O=TextGrabber, L=Local, S=Local, C=CN"

      - name: Run unit tests and build Debug & Release APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: textgrabber123
          RELEASE_KEY_ALIAS: textgrabber
          RELEASE_KEY_PASSWORD: textgrabber123
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Prepare and verify APK outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TextGrabber-v1.4.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/TextGrabber-v1.4.0-debug.apk
          ls -lh dist/
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose dist/TextGrabber-v1.4.0-release.apk
          "$APKSIGNER" verify --verbose dist/TextGrabber-v1.4.0-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: textgrabber-apks
          path: dist/*.apk
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: TextGrabber ${{ github.ref_name }}
          body: |
            TextGrabber 改造增强版 ${{ github.ref_name }}
            - 升级：悬浮窗全量无障碍深抓引擎（彻底移除 isVisibleToUser 限制，全量抓取当前应用全部窗口与子窗口、屏幕外预加载/隐藏/异步延迟节点；后台随事件维护页面级滚动与延迟缓存，并在点击「提取」后执行自适应多轮延迟采样与智能去重合并，大幅提升抓全率，开头自动加「详细总结」一键复制）
            - 包含 v1.3.0 & v1.2.0 全部增强：悬浮窗快捷提取开关与自定义前缀、一键清空文本/缓存/数据库、一键导出全部抓包文本/纯文本/CSV/原始DB、全量抓包存档展示及单条/全部一键复制
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
