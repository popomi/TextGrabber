name: Build TextGrabber APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable with LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias textgrabber \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass textgrabber123 \
            -keypass textgrabber123 \
            -dname "CN=TextGrabber, OU=Dev, O=TextGrabber, L=Local, S=Local, C=CN"

      - name: Run unit tests and build Debug & Release APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: textgrabber123
          RELEASE_KEY_ALIAS: textgrabber
          RELEASE_KEY_PASSWORD: textgrabber123
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Prepare and verify APK outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TextGrabber-v1.2.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/TextGrabber-v1.2.0-debug.apk
          ls -lh dist/
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose dist/TextGrabber-v1.2.0-release.apk
          "$APKSIGNER" verify --verbose dist/TextGrabber-v1.2.0-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: textgrabber-apks
          path: dist/*.apk
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: TextGrabber ${{ github.ref_name }}
          body: |
            TextGrabber 改造增强版 ${{ github.ref_name }}
            - 新增：一键清空文本、内存去重缓存与 SQLite 数据库（含 VACUUM 回收空间）
            - 新增：一键导出当前抓包全部文本至 Download/TextGrabber/，并支持导出纯文字 .txt、CSV 明细表与原始 .db 数据库及系统分享
            - 新增：全量存档展示（解除 50 条与 50 字截断限制），支持「按时间抓包」「数据库无障碍包」「纯文本全文」三种视图切换
            - 新增：单条/单包/全部/纯文本一键复制、无障碍包名筛选、时间正倒序切换与实时搜索
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
